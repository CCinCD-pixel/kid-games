<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>星港学习入口对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #dfe2dc; color: #24413d; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 16px; font-size: 22px; }
    .pair { width: 818px; margin: 0 0 34px; }
    .labels { display: grid; grid-template-columns: 390px 390px; gap: 18px; margin-bottom: 9px; font-size: 15px; font-weight: 800; }
    .screens { display: grid; grid-template-columns: 390px 390px; gap: 18px; }
    img { display: block; width: 390px; height: 844px; object-fit: cover; box-shadow: 0 7px 20px #243f3944; }
  </style>
</head>
<body>
  <section class="pair" id="chess"><h1>棋手学院 · 手机首页</h1><div class="labels"><span>当前实现</span><span>UI 提案</span></div><div class="screens"><img src="chess-current.png" alt="棋手学院当前首页" /><img src="chess-proposal.png" alt="棋手学院首页提案" /></div></section>
  <section class="pair" id="mars"><h1>火星基地 · 手机首页</h1><div class="labels"><span>当前实现</span><span>UI 提案</span></div><div class="screens"><img src="mars-current.png" alt="火星基地当前首页" /><img src="mars-proposal.png" alt="火星基地首页提案" /></div></section>
</body>
</html>
