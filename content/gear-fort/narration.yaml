  - {id: fort.good.counter.shooter, role: dad, text: "你用连弩车拆掉了{n}个机关。", norm: 你用连弩车拆掉了好多机关。}
  - {id: fort.good.counter.lobber, role: dad, text: "你用籍车拆掉了{n}个机关。", norm: 你用籍车拆掉了好多机关。}
  - {id: fort.good.counter.burner, role: dad, text: "你用火油罐拆掉了{n}个机关。", norm: 你用火油罐拆掉了好多机关。}
  - {id: fort.good.counter.beam, role: dad, text: "你用阳燧拆掉了{n}个机关。", norm: 你用阳燧拆掉了好多机关。}
  - {id: fort.good.counter.radial, role: dad, text: "你用转射机拆掉了{n}个机关。", norm: 你用转射机拆掉了好多机关。, pinyin: {转射机: zhuàn shè jī}}
  - {id: fort.good.counter.spikes, role: dad, text: "铁蒺藜让冲车冲不起来{n}次。", norm: 铁蒺藜让冲车冲不起来好几次。, pinyin: {冲车: chōng chē}}
  - {id: fort.good.counter.pit, role: dad, text: "陷坑收走了{n}个机关。", norm: 陷坑收走了好几个机关。}
  - {id: fort.good.counter.strike, role: dad, text: "你用礌石拆掉了{n}个机关。", norm: 你用礌石拆掉了好多机关。}
  - {id: fort.good.counter.gust, role: dad, text: "风箱吹落了{n}只木鹊。", norm: 风箱吹落了好几只木鹊。}
  - {id: fort.good.counter.hook, role: dad, text: "钩拒拉倒了{n}架云梯。", norm: 钩拒拉倒了好几架云梯。, pinyin: {拉倒: lā dǎo}}
  - {id: fort.good.log, role: dad, text: 檑木帮你挡住了一次。, pinyin: {檑木: léi mù}}
  - {id: fort.good.hold, role: dad, text: "你守住了{k}面大波。", norm: 你守住了好几面大波。}
  - {id: fort.good.learned, role: dad, text: 今天又学会了一招！}
  - {id: fort.ghost.start, role: dad, text: 看我怎么开局。}
  - {id: fort.ghost.farm, role: dad, text: 先种田。, pinyin: {种田: zhòng tián}}
  - {id: fort.ghost.bank, role: dad, text: 夜里先建粮仓。}
  - {id: fort.ghost.lane, role: dad, text: 这一路先放一台。}
  - {id: fort.ghost.wall, role: dad, text: 木垒挡在前面。}
  - {id: fort.ghost.counter, role: dad, text: 看它怕什么，就放什么。}
  - {id: fort.ghost.collect, role: dad, text: 粮包点一下就收。}
  - {id: fort.ghost.try, role: dad, text: 看清楚了吗？你来试试！}
  - {id: fort.result.win, role: dad, text: 这一招，挡住了！}
  - {id: fort.result.lose, role: dad, text: 推演没守住，我们复盘看看。}
  - {id: fort.result.flag, role: dad, text: "从第{n}面战鼓重来？", norm: 从刚才那面战鼓重来？, pinyin: {重来: chóng lái}}
  - {id: fort.result.assist, role: dad, text: 要不要我帮你一把？}
  - {id: fort.result.ghost, role: dad, text: 看看我怎么守这一段？}
  - {id: fort.result.star3, role: dad, text: 鲁班的附加题，也做到了！}
  - {id: fort.ui.home, role: dad, text: 回大厅？这一局会存好。}
  - {id: fort.ui.seal, role: dad, text: 带上它。}
  - {id: fort.ui.recommend, role: dad, text: 我帮你挑好了，你还能改。}
  - {id: fort.ui.choose, role: dad, text: 选好牒，按开始推演。}
  - {id: fort.ui.unknown, role: dad, text: 多遇见几次，就知道了。}
  - {id: fort.ui.star3rule, role: dad, text: 鲁班出了一道附加题。}
  - {id: fort.env.night, role: dad, text: 天黑了，没有人送粮了。}
  - {id: fort.env.fog, role: dad, text: 起雾了，右边看不清。}
  - {id: fort.env.dawn, role: dad, text: 天亮了！阳燧能用了。}
  - {id: fort.belt.full, role: dad, text: 传送带堆满了。}
  - {id: fort.pz.intro, role: dad, text: 先摆好，再按开始推演。}
  - {id: fort.pz.budget, role: dad, text: "这道题有{n}粮。", norm: 看看这道题有多少粮。}
  - {id: fort.pz.notyet, role: dad, text: 还没守住，改一改再推。}
  - {id: fort.pz.held, role: dad, text: 守住了！}
  - {id: fort.pz.par, role: dad, text: 正好够，一粒粮都没浪费！}
  - {id: fort.pz.g1, role: dad, text: 精打细算：粮正好够用。}
  - {id: fort.pz.g2, role: dad, text: 对症下药：看清再选牒。}
  - {id: fort.pz.fei.1, role: dad, text: 这道题，一台射的都没有。}
  - {id: fort.pz.fei.2, role: dad, text: 挡住、推回、收走，也能守。}
  - {id: fort.fam.intro.1, role: dad, text: 爸爸当鲁班，你来守城。}
  - {id: fort.fam.intro.2, role: dad, text: 鼓响的时候，爸爸才能出牌。}
  - {id: fort.fam.rotate, role: dad, text: 转过来，和爸爸面对面玩。}
  - {id: fort.fam.win, role: dad, text: 守住了！鲁班的招用完了。}
  - {id: fort.fam.lose, role: dad, text: 爸爸这招厉害！再来一局？}
  - {id: fort.fam.more, role: dad, text: 给爸爸多一点木料吗？}
  - {id: fort.fam.less, role: dad, text: 给爸爸少一点木料吗？}
  - {id: fort.inn.1-3.1, role: dad, text: 今天学会了先挡后打。}
  - {id: fort.inn.1-6.1, role: dad, text: 鲁班按哪路，就先防哪路。}
  - {id: fort.inn.1-9.1, role: dad, text: 铜不怕火，可怕聚起来的阳光。}
  - {id: fort.inn.1-11.1, role: dad, text: 第一卷推演完了！, pinyin: {第一卷: dì yī juàn}}
  - {id: fort.inn.1-11.2, role: dad, text: 宋城修好了一大半。}
  - {id: fort.inn.2-3.1, role: dad, text: 风能帮我们，也能帮火。}
  - {id: fort.inn.2-6.1, role: dad, text: 云梯再高，钩拒一拉就倒。, pinyin: {拉就倒: lā jiù dǎo}}
  - {id: fort.inn.2-9.1, role: dad, text: 夜里的考验，你都守住了。}
  - {id: fort.inn.2-11.1, role: dad, text: 天亮了，郢都就在前面。}
  - {id: fort.inn.2-11.2, role: dad, text: 回家讲给爸爸听吧。}
  - {id: fort.inn.stop, role: dad, text: 今天就到这里，好不好？}
  - {id: fort.ask.1-1, role: dad, text: 讲给爸爸听：连弩车是怎么拆掉木甲兵的？}
  - {id: fort.ask.1-2, role: dad, text: 讲给爸爸听：为什么先种禾田？, pinyin: {种禾田: zhòng hé tián}}
  - {id: fort.ask.1-3, role: dad, text: 讲给爸爸听：木垒为什么要放在连弩车前面？}
  - {id: fort.ask.1-4, role: dad, text: 讲给爸爸听：盾挡住了箭，挡得住从天上落下的石头吗？}
  - {id: fort.ask.1-5, role: dad, text: 讲给爸爸听：冲车为什么要先跑起来才撞得狠？, pinyin: {冲车: chōng chē}}
  - {id: fort.ask.1-6, role: dad, text: 讲给爸爸听：鲁班的手按住了哪两路？你提前做了什么？}
  - {id: fort.ask.1-7, role: dad, text: 讲给爸爸听：一箭只能拆一只蚂蚁，一罐火油呢？}
  - {id: fort.ask.1-8, role: dad, text: 讲给爸爸听：礌石为什么要等它们挤在一起再砸？}
  - {id: fort.ask.1-9, role: dad, text: 讲给爸爸听：火油罐为什么烧不动铜甲力士？}
  - {id: fort.ask.1-10, role: dad, text: 讲给爸爸听：你为什么带了这几张牒？}
  - {id: fort.ask.1-11, role: dad, text: 讲给爸爸听：铜犀缩进壳里时，什么能把壳敲裂？, pinyin: {敲裂: qiāo liè}}
  - {id: fort.ask.2-1, role: dad, text: 讲给爸爸听：粮仓要等一会儿才出粮，为什么还值得先建？}
  - {id: fort.ask.2-2, role: dad, text: 讲给爸爸听：木鹊飞过了连弩车，为什么转射机打得到它？, pinyin: {转射机: zhuàn shè jī}}
  - {id: fort.ask.2-3, role: dad, text: 讲给爸爸听：风箱吹不动谁？为什么？}
  - {id: fort.ask.2-4, role: dad, text: 讲给爸爸听：烟里看不见，籍车为什么还能打中？, pinyin: {打中: dǎ zhòng}}
  - {id: fort.ask.2-5, role: dad, text: 讲给爸爸听：雾里看不见，你怎么知道每路都要守？}
  - {id: fort.ask.2-6, role: dad, text: 讲给爸爸听：云梯压住的是哪一台？}
  - {id: fort.ask.2-7, role: dad, text: 讲给爸爸听：牒片送来时，你是怎么决定放哪儿的？}
  - {id: fort.ask.2-8, role: dad, text: 讲给爸爸听：为什么先拆鼓车？}
  - {id: fort.ask.2-9, role: dad, text: 讲给爸爸听：风箱和火油罐放在同一路，会发生什么？}
  - {id: fort.ask.2-10, role: dad, text: 讲给爸爸听：天亮前和天亮后，你的打法有什么不一样？}
  - {id: fort.ask.2-11, role: dad, text: 讲给爸爸听：木鸢什么时候最好打？}
  - {id: fort.ask.x.1, role: dad, text: 讲给爸爸听：陆战棋里，有没有“擒贼先擒王”？}
  - {id: fort.ask.x.2, role: dad, text: 讲给爸爸听：推箱子的时候，你会不会先想好再推？}
  - {id: fort.ask.x.3, role: dad, text: 讲给爸爸听：下棋时你先保护什么？像不像保护粮仓？}
  - {id: fort.repair.1-1, role: narrator, text: 城门换上了新门闩。}
  - {id: fort.repair.1-2, role: narrator, text: 第一块粟田发芽了。}
  - {id: fort.repair.1-3, role: narrator, text: 东边的城墙补好了一段。}
  - {id: fort.repair.1-4, role: narrator, text: 城楼的木梯修好了。}
  - {id: fort.repair.1-5, role: narrator, text: 护城的小桥铺上了木板。}
  - {id: fort.repair.1-6, role: narrator, text: 水井装上了辘轳。, pinyin: {辘轳: lù lu}}
  - {id: fort.repair.1-7, role: narrator, text: 第二块粟田长高了。, pinyin: {长高: zhǎng gāo}}
  - {id: fort.repair.1-8, role: narrator, text: 西边的城墙补齐了。}
  - {id: fort.repair.1-9, role: narrator, text: 铁匠铺的炉子点着了。, pinyin: {点着: diǎn zháo}}
  - {id: fort.repair.1-10, role: narrator, text: 孩子们有了秋千。}
  - {id: fort.repair.1-11, role: narrator, text: 铜犀折成的犁，犁开了第三块田。}
  - {id: fort.repair.2-1, role: narrator, text: 城里点起了第一盏灯笼。}
  - {id: fort.repair.2-2, role: narrator, text: 粟田边立起了稻草人。}
  - {id: fort.repair.2-3, role: narrator, text: 磨坊装上了风车。}
  - {id: fort.repair.2-4, role: narrator, text: 烟囱冒出了炊烟。}
  - {id: fort.repair.2-5, role: narrator, text: 雾散了，城头挂起了风铃。, pinyin: {雾散: wù sàn}}
  - {id: fort.repair.2-6, role: narrator, text: 城墙加了一层垛口。, pinyin: {垛口: duǒ kǒu}}
  - {id: fort.repair.2-7, role: narrator, text: 驿站的马车修好了。}
  - {id: fort.repair.2-8, role: narrator, text: 城楼挂上了报时的大鼓。}
  - {id: fort.repair.2-9, role: narrator, text: 粮仓装满了。}
  - {id: fort.repair.2-10, role: narrator, text: 太阳从城后升起来了。}
  - {id: fort.repair.2-11, role: narrator, text: 木鸢折成的风筝，挂在城楼上。}
  - {id: fort.alm.shooter.1, role: narrator, text: 连弩车：一次能装好多支箭的大弩车。}
  - {id: fort.alm.shooter.2, role: narrator, text: 弓弦拉得越紧，箭飞得越远。}
  - {id: fort.alm.farm.1, role: narrator, text: 禾田：种下粟，就会长出粮。}
  - {id: fort.alm.farm.2, role: narrator, text: 庄稼要晒太阳，夜里长得慢。, pinyin: {长得慢: zhǎng de màn}}
  - {id: fort.alm.wall.1, role: narrator, text: 木垒：用木头和土垒起来的墙。}
  - {id: fort.alm.wall.2, role: narrator, text: 先挡住，后面的车才能慢慢打。}
  - {id: fort.alm.lobber.1, role: narrator, text: 籍车：把石头抛过城墙的投石车。, pinyin: {籍车: jí chē}}
  - {id: fort.alm.lobber.2, role: narrator, text: 杠杆：短的一头一压，长的一头就甩出去。, pinyin: {一头: yì tóu}}
  - {id: fort.alm.spikes.1, role: narrator, text: 铁蒺藜：撒在地上的四角铁刺。}
  - {id: fort.alm.spikes.2, role: narrator, text: 四个尖角，怎么扔都有一个尖朝上。}
  - {id: fort.alm.pit.1, role: narrator, text: 陷坑：提前挖好、盖上草的坑。}
  - {id: fort.alm.pit.2, role: narrator, text: 机关一踩就掉下去，被收走了。}
  - {id: fort.alm.burner.1, role: narrator, text: 火油罐：装着火油的陶罐。}
  - {id: fort.alm.burner.2, role: narrator, text: 木头会烧，青铜不会烧。同一把火，要看材料。}
  - {id: fort.alm.strike.1, role: narrator, text: 礌石：守城时从城上推下的大石头。}
  - {id: fort.alm.strike.2, role: narrator, text: 石头越重，砸下来越有力。}
  - {id: fort.alm.beam.1, role: narrator, text: 阳燧：青铜做的凹面镜。, pinyin: {凹面镜: āo miàn jìng}}
  - {id: fort.alm.beam.2, role: narrator, text: 凹面镜把阳光聚到一点，那一点会变得很热。}
  - {id: fort.alm.bank.1, role: narrator, text: 粮仓：存粮的大仓库。}
  - {id: fort.alm.bank.2, role: narrator, text: 先花粮建仓，以后一大包一大包地来。}
  - {id: fort.alm.radial.1, role: narrator, text: 转射机：能转圈的弩机。, pinyin: {转射机: zhuàn shè jī}}
  - {id: fort.alm.radial.2, role: narrator, text: 前后左右、天上飞的，都打得到。}
  - {id: fort.alm.gust.1, role: narrator, text: 橐，就是风箱：一拉一推，风就吹出去。, pinyin: {橐: tuó}}
  - {id: fort.alm.gust.2, role: narrator, text: 风能吹走烟，也能让火烧得更旺。}
  - {id: fort.alm.hook.1, role: narrator, text: 钩拒：一头是钩子，一头是推杆。}
  - {id: fort.alm.hook.2, role: narrator, text: 鲁班为楚国船战做了钩拒；墨子说：我的钩拒是爱和尊敬，比它还厉害。}
  - {id: fort.alm.walker.1, role: narrator, text: 木甲兵：会走路的木头人。}
  - {id: fort.alm.walker.2, role: narrator, text: 会走路的木头人，是古人的想象。, pinyin: {想象: xiǎng xiàng}}
  - {id: fort.alm.shielder.1, role: narrator, text: 盾甲兵：举着大木盾的木甲兵。}
  - {id: fort.alm.shielder.2, role: narrator, text: 盾挡得住正面，挡不住头顶。}
  - {id: fort.alm.ram.1, role: narrator, text: 冲车：用来撞城门的车。, pinyin: {冲车: chōng chē}}
  - {id: fort.alm.ram.2, role: narrator, text: 跑得越久，撞得越狠，这叫动量。}
  - {id: fort.alm.ant.1, role: narrator, text: 蚁傅：像蚂蚁一样一拥而上。, pinyin: {蚁傅: yǐ fù}}
  - {id: fort.alm.ant.2, role: narrator, text: 古书里真有这一招，画成小木蚁是游戏的想象。, pinyin: {想象: xiǎng xiàng}}
  - {id: fort.alm.brute.1, role: narrator, text: 铜甲力士：穿着青铜甲的大力士。}
  - {id: fort.alm.brute.2, role: narrator, text: 铜不怕火；重的东西，风吹不动。}
  - {id: fort.alm.flyer.1, role: narrator, text: 木鹊：传说鲁班做过会飞的木鸟。}
  - {id: fort.alm.flyer.2, role: narrator, text: 传说它飞上天，三天都没有落下来。, pinyin: {落下来: luò xià lái}}
  - {id: fort.alm.smoker.1, role: narrator, text: 烟车：会放烟的车。}
  - {id: fort.alm.smoker.2, role: narrator, text: 烟挡住眼睛，可挡不住从天上落下的石头。}
  - {id: fort.alm.ladder.1, role: narrator, text: 云梯车：架上城墙的高梯子。}
  - {id: fort.alm.ladder.2, role: narrator, text: 鲁班为楚王造过云梯，这是古书里写的。}
  - {id: fort.alm.drummer.1, role: narrator, text: 鼓车：载着大鼓的车。}
  - {id: fort.alm.drummer.2, role: narrator, text: 古时候打仗击鼓前进，鼓声让人跟着节奏走。, pinyin: {击鼓: jī gǔ}}
  - {id: fort.alm.rhino.1, role: narrator, text: 铜犀冲车：外壳是青铜的大冲车。, pinyin: {冲车: chōng chē}}
  - {id: fort.alm.rhino.2, role: narrator, text: 它后来变成了一把犁，帮宋城翻地。}
  - {id: fort.alm.owl.1, role: narrator, text: 夜枭木鸢：夜里飞的大木鸟。, pinyin: {夜枭木鸢: yè xiāo mù yuān}}
  - {id: fort.alm.owl.2, role: narrator, text: 天一亮它就停不住了，后来变成了一只风筝。}
  - {id: fort.alm.walker.fear, role: dad, text: 木甲兵谁都怕，连弩车最省粮。}
  - {id: fort.alm.shielder.fear, role: dad, text: 盾挡得住箭，挡不住从天上落下的石头。}
  - {id: fort.alm.ram.fear, role: dad, text: 冲车要跑起来才撞得狠，蒺藜让它跑不起来。, pinyin: {冲车: chōng chē}}
  - {id: fort.alm.ant.fear, role: dad, text: 一箭一只太慢了，一罐火油一大片。}
  - {id: fort.alm.brute.fear, role: dad, text: 铜不怕火。重石和聚起来的阳光才对付得了它。, pinyin: {重石: zhòng shí}}
  - {id: fort.alm.flyer.fear, role: dad, text: 飞在天上的，转射机打得到；风箱能把它吹下来。, pinyin: {转射机: zhuàn shè jī}}
  - {id: fort.alm.smoker.fear, role: dad, text: 烟里看不见。吹散它，或者用不用看的籍车。, pinyin: {吹散: chuī sàn}}
  - {id: fort.alm.ladder.fear, role: dad, text: 梯子一架起来，后面三台都被压住。钩拒把梯子拉倒。, pinyin: {拉倒: lā dǎo}}
  - {id: fort.alm.drummer.fear, role: dad, text: 鼓一响，旁边的机关都变快。先拆鼓车。, pinyin: {鼓车: gǔ chē}}
  - {id: fort.jn.econ, role: dad, text: 兵马未动，粮草先行：先把粮准备好。}
  - {id: fort.jn.invest, role: dad, text: 磨刀不误砍柴工：先花一点，以后得更多。, pinyin: {磨刀不误砍柴工: mó dāo bú wù kǎn chái gōng, 得更多: dé gèng duō}}
  - {id: fort.jn.counter, role: dad, text: 对症下药：看清它怕什么，再选牒。}
  - {id: fort.jn.aoe, role: dad, text: 一网打尽：成群的，用一罐火一大片。}
  - {id: fort.jn.timing, role: dad, text: 好钢用在刀刃上：大招留到最要紧的时候。, pinyin: {好钢: hǎo gāng}}
  - {id: fort.jn.guard, role: dad, text: 防止后院起火：先护住自己的粮田。}
  - {id: fort.jn.control, role: dad, text: 以逸待劳：先布好阵歇一歇，等它跑累了再收拾它。}
  - {id: fort.jn.depth, role: dad, text: 未雨绸缪：没下雨，先把伞准备好。}
  - {id: fort.jn.smoke, role: dad, text: 拨云见日：吹开烟，就看得见了。}
  - {id: fort.jn.cover, role: dad, text: 有备无患：每一路都准备好，就不怕。}
  - {id: fort.jn.preview, role: dad, text: 知己知彼：先看鲁班出什么招，再选牒。}
  - {id: fort.jn.daynight, role: dad, text: 因时制宜：白天黑夜，打法不一样。}
  - {id: fort.jn.improvise, role: dad, text: 随机应变：来什么，就用什么。}
  - {id: fort.jn.priority, role: dad, text: 擒贼先擒王：先拆最要紧的那一个。, pinyin: {擒贼先擒王: qín zéi xiān qín wáng}}
  - {id: fort.fail.ramNoSpikes.1, role: dad, text: 冲车在第1路跑起来了。, norm: 冲车在第一路跑起来了。, pinyin: {冲车: chōng chē}}
  - {id: fort.fail.swarmNoFire.1, role: dad, text: 蚁傅从第1路涌过去了。, norm: 蚁傅从第一路涌过去了。, pinyin: {蚁傅: yǐ fù}}
  - {id: fort.fail.smokeBlind.1, role: dad, text: 第1路被烟罩住，连弩看不见。, norm: 第一路被烟罩住，连弩看不见。}
  - {id: fort.fail.lostAttackers.1, role: dad, text: 第1路的牒被咬光了。, norm: 第一路的牒被咬光了。, pinyin: {牒: dié}}
  - {id: fort.fail.warnIgnored.1, role: dad, text: 鲁班按住第1路，那里没准备。, norm: 鲁班按住第一路，那里没准备。}
  - {id: fort.fail.ramNoSpikes.2, role: dad, text: 冲车在第2路跑起来了。, norm: 冲车在第二路跑起来了。, pinyin: {冲车: chōng chē}}
  - {id: fort.fail.swarmNoFire.2, role: dad, text: 蚁傅从第2路涌过去了。, norm: 蚁傅从第二路涌过去了。, pinyin: {蚁傅: yǐ fù}}
  - {id: fort.fail.smokeBlind.2, role: dad, text: 第2路被烟罩住，连弩看不见。, norm: 第二路被烟罩住，连弩看不见。}
  - {id: fort.fail.lostAttackers.2, role: dad, text: 第2路的牒被咬光了。, norm: 第二路的牒被咬光了。, pinyin: {牒: dié}}
  - {id: fort.fail.warnIgnored.2, role: dad, text: 鲁班按住第2路，那里没准备。, norm: 鲁班按住第二路，那里没准备。}
  - {id: fort.fail.ramNoSpikes.3, role: dad, text: 冲车在第3路跑起来了。, norm: 冲车在第三路跑起来了。, pinyin: {冲车: chōng chē}}
  - {id: fort.fail.swarmNoFire.3, role: dad, text: 蚁傅从第3路涌过去了。, norm: 蚁傅从第三路涌过去了。, pinyin: {蚁傅: yǐ fù}}
  - {id: fort.fail.smokeBlind.3, role: dad, text: 第3路被烟罩住，连弩看不见。, norm: 第三路被烟罩住，连弩看不见。}
  - {id: fort.fail.lostAttackers.3, role: dad, text: 第3路的牒被咬光了。, norm: 第三路的牒被咬光了。, pinyin: {牒: dié}}
  - {id: fort.fail.warnIgnored.3, role: dad, text: 鲁班按住第3路，那里没准备。, norm: 鲁班按住第三路，那里没准备。}
  - {id: fort.fail.ramNoSpikes.4, role: dad, text: 冲车在第4路跑起来了。, norm: 冲车在第四路跑起来了。, pinyin: {冲车: chōng chē}}
  - {id: fort.fail.swarmNoFire.4, role: dad, text: 蚁傅从第4路涌过去了。, norm: 蚁傅从第四路涌过去了。, pinyin: {蚁傅: yǐ fù}}
  - {id: fort.fail.smokeBlind.4, role: dad, text: 第4路被烟罩住，连弩看不见。, norm: 第四路被烟罩住，连弩看不见。}
  - {id: fort.fail.lostAttackers.4, role: dad, text: 第4路的牒被咬光了。, norm: 第四路的牒被咬光了。, pinyin: {牒: dié}}
  - {id: fort.fail.warnIgnored.4, role: dad, text: 鲁班按住第4路，那里没准备。, norm: 鲁班按住第四路，那里没准备。}
  - {id: fort.fail.ramNoSpikes.5, role: dad, text: 冲车在第5路跑起来了。, norm: 冲车在第五路跑起来了。, pinyin: {冲车: chōng chē}}
  - {id: fort.fail.swarmNoFire.5, role: dad, text: 蚁傅从第5路涌过去了。, norm: 蚁傅从第五路涌过去了。, pinyin: {蚁傅: yǐ fù}}
  - {id: fort.fail.smokeBlind.5, role: dad, text: 第5路被烟罩住，连弩看不见。, norm: 第五路被烟罩住，连弩看不见。}
  - {id: fort.fail.lostAttackers.5, role: dad, text: 第5路的牒被咬光了。, norm: 第五路的牒被咬光了。, pinyin: {牒: dié}}
  - {id: fort.fail.warnIgnored.5, role: dad, text: 鲁班按住第5路，那里没准备。, norm: 鲁班按住第五路，那里没准备。}
  - {id: fort.fail.drummerAlive, role: dad, text: 鼓车让旁边的机关又快又硬。, pinyin: {鼓车: gǔ chē}}
  - {id: fort.fail.noWall, role: dad, text: 连弩车被咬坏了，前面没有木垒。}
  - {id: fort.fail.strikeUnused, role: dad, text: 礌石带了，大波来时没用上。}
  - {id: fort.tip.alt.ram, role: dad, text: 趁冲车还没跑起来，先拆它。, pinyin: {冲车: chōng chē}}
  - {id: fort.tip.alt.ladder, role: dad, text: 火油罐能烧断梯子。}
  - {id: fort.tip.alt.ant, role: dad, text: 风箱把蚁傅吹回去。, pinyin: {蚁傅: yǐ fù}}
  - {id: fort.tip.alt.walker, role: dad, text: 每一路先放一台连弩车。}
  - {id: fort.tip.alt.shielder, role: dad, text: 盾甲兵前面放木垒，多打一会儿。}
  - {id: fort.tip.alt.shielder_m, role: dad, text: 铜盾挡箭，从上面打它。}
  - {id: fort.tip.alt.brute, role: dad, text: 力士前面放木垒，再多放两台。}
  - {id: fort.tip.alt.flyer, role: dad, text: 木鹊落下来时，再打它。}
  - {id: fort.tip.alt.smoker, role: dad, text: 先拆烟车，烟就散了。}
  - {id: fort.tip.alt.drummer, role: dad, text: 先拆鼓车，旁边的就慢了。, pinyin: {鼓车: gǔ chē}}
  - {id: fort.tip.alt.rhino, role: dad, text: 铜壳只怕重石和阳燧。}
  - {id: fort.tip.alt.owl, role: dad, text: 等它落地，什么都打得到。}
  - {id: fort.tip.swarmNoFire, role: dad, text: 成群的，用火油罐。}
  - {id: fort.tip.smokeBlind, role: dad, text: 风箱吹散烟。}
  - {id: fort.tip.smokeBlind.2, role: dad, text: 籍车不怕烟。}
  - {id: fort.tip.drummerAlive, role: dad, text: 先拆鼓车，再拆别的。, pinyin: {鼓车: gǔ chē}}
  - {id: fort.tip.drummerAlive.strike, role: dad, text: 先用礌石砸鼓车。, pinyin: {鼓车: gǔ chē}}
  - {id: fort.tip.drummerAlive.lobber, role: dad, text: 先用籍车拆鼓车。, pinyin: {鼓车: gǔ chē}}
  - {id: fort.tip.noWall, role: dad, text: 木垒放在连弩车前面。}
  - {id: fort.tip.wallLate, role: dad, text: 木垒要在它们走到之前放好。}
  - {id: fort.tip.lostAttackers, role: dad, text: 大波前给这一路多放两台。}
  - {id: fort.tip.warnIgnored, role: dad, text: 看到鲁班的手，先在那一路挖坑。}
  - {id: fort.tip.warnIgnored.2, role: dad, text: 看到鲁班的手，那一路多放牒。, pinyin: {牒: dié}}
  - {id: fort.tip.strikeUnused, role: dad, text: 大波扎堆时，用礌石砸。, pinyin: {扎堆: zhā duī}}
  - {id: fort.story.0.b1, role: dad, text: 这是鲁班做的沙盘，我们在沙盘上替宋城守一守。}
  - {id: fort.lvl.2-10.infer, role: dad, text: 看它的标签，想想谁对付得了它。}
  - {id: fort.result.assist2, role: dad, text: 要不要我陪你一起摆？}
  - {id: fort.ui.assist2.tap, role: dad, text: 点一下，就放在这里。}
  - {id: fort.ui.bonusLost, role: dad, text: 这次附加题没做到，没关系。}
  - {id: fort.ui.resume, role: dad, text: 接着上次的推演吗？}
  - {id: fort.coach.boss.owlRage, role: dad, text: 木鸢发怒了，多放转射机！, pinyin: {转射机: zhuàn shè jī}}
  - {id: fort.alm.shielder_m.1, role: dad, text: 铜盾甲兵：木头身子，举着一面铜盾。}
  - {id: fort.alm.shielder_m.2, role: dad, text: 铜盾挡箭也不怕火，可它的木身子挡不住从天上落下来的东西。}
  - {id: fort.alm.shielder_m.fear, role: dad, text: 铜盾挡得住箭，挡不住从天上落下的石头和火。}
  - {id: fort.jn.infer, role: dad, text: 举一反三：看它的标签，就知道谁对付得了它。, pinyin: {举一反三: jǔ yī fǎn sān}}
