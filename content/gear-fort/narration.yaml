lines:
  - {id: fort.dock.1, role: companion, text: 两千多年前，有一位叫墨子的科学家。}
  - {id: fort.dock.2, role: companion, text: 2016年，中国把量子卫星叫作墨子号。, norm: 二零一六年，中国把量子卫星叫作墨子号。, pinyin: {墨子号: mò zǐ hào, 量子: liàng zǐ}}
  - {id: fort.dock.3, role: companion, text: 走，我们去见见墨子！}
  - {id: fort.dock.v1, role: companion, text: 墨子号卫星，就是用他的名字命名的。, pinyin: {墨子号: mò zǐ hào}}
  - {id: fort.dock.v2, role: companion, text: 第二卷推演完成！你守住了十天十夜。, pinyin: {第二卷: dì èr juàn}}
  - {id: fort.story.0.1, role: narrator, text: 很久以前，楚王想去攻打小小的宋国。}
  - {id: fort.story.0.2, role: narrator, text: 鲁班为楚王造好了高高的云梯。}
  - {id: fort.story.0.3, role: narrator, text: 墨子带着最小的弟子小步步，出发去劝楚王。}
  - {id: fort.story.0.3.plain, role: narrator, text: 墨子带着最小的弟子，出发去劝楚王。}
  - {id: fort.story.0.5, role: dad, text: 好。沙盘上分出胜负，真仗就不用打了。}
  - {id: fort.story.1.end.1, role: narrator, text: 铜犀冲车被拆开了。, pinyin: {冲车: chōng chē}}
  - {id: fort.story.1.end.3, role: narrator, text: 宋城外的粟田，又犁开了一块。}
  - {id: fort.story.2.open.1, role: narrator, text: 墨子赶路去楚国，走了十天十夜。}
  - {id: fort.story.2.open.2, role: dad, text: 夜里没人送粮。点起篝火，接着推演。}
  - {id: fort.story.2.end.1, role: narrator, text: 夜枭木鸢收起翅膀，折成了一只风筝。, pinyin: {夜枭木鸢: yè xiāo mù yuān}}
  - {id: fort.story.2.end.3, role: narrator, text: 远处，楚国郢都的城墙出现了。, pinyin: {郢都: yǐng dū}}
  - {id: fort.lvl.1-1.1, role: dad, text: 鲁班的木甲兵要来了。}
  - {id: fort.lvl.1-1.2, role: dad, text: 把连弩车拖到第3路。, norm: 把连弩车拖到第三路。}
  - {id: fort.lvl.1-2.1, role: dad, text: 先种禾田，粮会越来越多。}
  - {id: fort.lvl.1-2.2, role: dad, text: 再放连弩车守住来的路。}
  - {id: fort.lvl.1-3.1, role: dad, text: 木垒放在连弩车前面。}
  - {id: fort.lvl.1-3.2, role: dad, text: 木垒挡着，连弩车慢慢打。}
  - {id: fort.lvl.1-4.1, role: dad, text: 盾甲兵的木盾，箭打不穿。}
  - {id: fort.lvl.1-4.2, role: dad, text: 试试籍车，石头从天上落。}
  - {id: fort.lvl.1-5.1, role: dad, text: 冲车跑起来，撞得最狠。}
  - {id: fort.lvl.1-5.2, role: dad, text: 木垒前面铺上铁蒺藜。}
  - {id: fort.lvl.1-6.1, role: dad, text: 看鲁班的手按住哪一路。}
  - {id: fort.lvl.1-6.2, role: dad, text: 提前在那一路挖好陷坑。}
  - {id: fort.lvl.1-7.1, role: dad, text: 蚁傅一来就是一大群。}
  - {id: fort.lvl.1-7.2, role: dad, text: 火油罐，一罐烧一片。}
  - {id: fort.lvl.1-8.1, role: dad, text: 礌石很重，要留着用。}
  - {id: fort.lvl.1-8.2, role: dad, text: 等机关挤在一起再砸。}
  - {id: fort.lvl.1-9.1, role: dad, text: 铜甲力士不怕火。}
  - {id: fort.lvl.1-9.2, role: dad, text: 阳燧把阳光聚起来照它。}
  - {id: fort.lvl.1-10.1, role: dad, text: 这回你自己选牒。}
  - {id: fort.lvl.1-10.2, role: dad, text: 先看看鲁班亮了什么招。}
  - {id: fort.lvl.1-11.1, role: dad, text: 铜犀冲车来了！}
  - {id: fort.lvl.1-11.2, role: dad, text: 想想，什么敲得开铜壳？}
  - {id: fort.lvl.2-1.1, role: dad, text: 夜里没有人送粮。}
  - {id: fort.lvl.2-1.2, role: dad, text: 先建粮仓，粮会自己来。}
  - {id: fort.lvl.2-2.1, role: dad, text: 木鹊会飞去啄禾田。}
  - {id: fort.lvl.2-2.2, role: dad, text: 转射机打得到天上的。}
  - {id: fort.lvl.2-3.1, role: dad, text: 这回没有转射机。}
  - {id: fort.lvl.2-3.2, role: dad, text: 风箱能把木鹊吹下来。}
  - {id: fort.lvl.2-4.1, role: dad, text: 烟车会放烟。}
  - {id: fort.lvl.2-4.2, role: dad, text: 烟里的连弩车看不见。}
  - {id: fort.lvl.2-5.1, role: dad, text: 起大雾了，右边看不清。}
  - {id: fort.lvl.2-5.2, role: dad, text: 每一路都先放一台。}
  - {id: fort.lvl.2-6.1, role: dad, text: 云梯车会架梯子。}
  - {id: fort.lvl.2-6.2, role: dad, text: 钩拒能把梯子拉倒。}
  - {id: fort.lvl.2-7.1, role: dad, text: 急报！这回没有粮。}
  - {id: fort.lvl.2-7.2, role: dad, text: 牒片会自己送过来。}
  - {id: fort.lvl.2-8.1, role: dad, text: 鼓车一敲，机关都变快。}
  - {id: fort.lvl.2-8.2, role: dad, text: 先拆鼓车！}
  - {id: fort.lvl.2-9.1, role: dad, text: 烟、蚁群、冲车一起来。}
  - {id: fort.lvl.2-9.2, role: dad, text: 风箱和火油罐放一路。}
  - {id: fort.lvl.2-10.1, role: dad, text: 天快亮了，先守住夜里。}
  - {id: fort.lvl.2-10.2, role: dad, text: 天亮以后，阳燧就能用。}
  - {id: fort.lvl.2-11.1, role: dad, text: 夜枭木鸢飞得很高。}
  - {id: fort.lvl.2-11.2, role: dad, text: 看影子，它要俯冲了。}
  - {id: fort.lvl.1-1.collect, role: dad, text: 点一下粮包，粮就进粮斗。}
  - {id: fort.lvl.1-1.more, role: dad, text: 粮够了，再放一台连弩车。}
  - {id: fort.lvl.1-1.again, role: dad, text: 看我的手，跟着拖一拖。}
  - {id: fort.lvl.1-2.farm, role: dad, text: 禾田种在最左边的格子。}
