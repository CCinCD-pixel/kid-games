    role: companion
    text: 算好流星糖往哪儿飞。
  - id: snake.m.c5m5.brief
    role: companion
    text: 保持第一到最后！
  - id: snake.m.c5m5.h1
    role: companion
    text: 领先时别去冒险。
  - id: snake.m.c5m6.brief
    role: companion
    text: 击败三条猎手！
  - id: snake.m.c5m6.h1
    role: companion
    text: 等猎手冲过来再截它。
  - id: snake.m.c5m7.brief
    role: companion
    text: 打败蛇王！
  - id: snake.m.c5m7.h1
    role: companion
    text: 蛇王冲过来时，横在它前面。
  - id: snake.m.c5m8.brief
    role: companion
    text: 戴着王冠长到三百！
    pinyin: { 长到: zhǎng dào }
  - id: snake.m.c5m8.h1
    role: companion
    text: 这一关慢慢享受。
  - id: snake.fact.venus
    role: narrator
    text: 金星是太阳系里最热的行星，比水星还热。
  - id: snake.fact.moonlight
    role: narrator
    text: 月亮自己不会发光，我们看到的是它反射的太阳光。
  - id: snake.fact.comet
    role: narrator
    text: 彗星的尾巴总是背对着太阳。
  - id: snake.fact.saturn
    role: narrator
    text: 土星的光环主要是冰块和石头。
  - id: snake.fact.dipper
    role: narrator
    text: 北斗七星连起来像一把勺子。
    speed: 0.92
  - id: snake.fact.blackhole
    role: narrator
    text: 黑洞的引力特别大，连光都跑不出来。
  - id: snake.fact.loco
    role: narrator
    text: 蒸汽火车烧煤把水变成蒸汽，推着车轮转。
    norm: 蒸汽火车烧煤把水变成蒸汽，推着车轮赚。   # 转 = zhuàn (rotate); 赚 is the monophonic homophone
  - id: snake.fact.rocket
    role: narrator
    text: 长征五号火箭很粗壮，大家叫它“胖五”。
  - id: snake.fact.mecha
    role: narrator
    text: 机器人的关节里有电机，电机一转，手臂就动了。
    norm: 机器人的关节里有电机，电机一赚，手臂就动了。   # 转 = zhuàn (rotate)
  - id: snake.fact.digger
    role: narrator
    text: 挖掘机的长臂是靠液压油推动的。
  - id: snake.fact.maglev
    role: narrator
    text: 磁悬浮列车靠磁力浮起来，开起来不碰铁轨。
  - id: snake.fact.tiangong
    role: narrator
    text: 中国空间站的名字叫“天宫”。
  - id: snake.fact.azure
    role: narrator
    text: 青龙是守护东方的神兽。
  - id: snake.fact.yinglong
    role: narrator
    text: 传说应龙帮大禹治水，用尾巴划出了河道。
    norm: 传说硬龙帮大禹治水，用尾巴划出了河道。   # 应龙 = yìng lóng; no monophonic lock char, so 硬
  - id: snake.fact.zhulong
    role: narrator
    text: 《山海经》里说，烛龙睁开眼是白天，闭上眼是黑夜。
  - id: snake.fact.tengshe
    role: narrator
    text: 古书里说，腾蛇没有脚，却能腾云飞行。
  - id: snake.fact.greatwall
    role: narrator
    text: 长城已经有两千多年的历史了。
  - id: snake.fact.basnake
    role: narrator
    text: 古书里说，巴蛇能吞下一头大象。
  - id: snake.fact.crown
    role: narrator
    text: 古代皇帝的礼帽前后挂着一串串小玉珠。
  - id: snake.fact.trail.stardust
    role: narrator
    text: 宇宙里飘着很多很细很细的尘埃。
  - id: snake.fact.trail.flame
    role: narrator
    text: 火箭向下喷火，火箭就向上飞。
  - id: snake.fact.trail.aurora
    role: narrator
    text: 木星上也有极光，比地球的还大。
  - id: snake.fact.trail.meteor
    role: narrator
    text: 流星是小石头冲进空气里烧出的光。
  - id: snake.fact.trail.cloud
    role: narrator
    text: 祥云是古人画在衣服和房子上的图案。
  - id: snake.fact.trail.lightning
    role: narrator
    text: 光比声音快，所以先看到闪电再听到雷。
