game: chess
lines:
  - { id: ch.s.title, role: companion, text: "棋手学院，欢迎来下棋。" }
  - { id: ch.s.hello, role: companion, text: "我是领航员，陪你下棋。" }
  - { id: ch.s.home, role: companion, text: "想学新招，还是下一盘？" }
  - { id: ch.s.saved, role: companion, text: "棋局已经替你存好了。" }
  - { id: ch.s.resume, role: companion, text: "上次的棋还在，接着下？" }
  - { id: ch.s.stop, role: companion, text: "今天下得很认真，歇一歇吧。" }
  - { id: ch.s.quick, role: companion, text: "来个小局，几分钟就下完。" }
  - { id: ch.tb.poke, role: companion, text: "点点看，每个子走法不一样。" }
  - { id: ch.tb.knight, role: companion, text: "马走日字，还会跳过去。" }
  - { id: ch.tb.bishop, role: companion, text: "象走斜线，一直走同色格。" }
  - { id: ch.tb.pawn, role: companion, text: "兵只往前，一次走一步。" }
  - { id: ch.tb.goal, role: companion, text: "抓住王，就赢了！" }
  - { id: ch.tb.mate, role: companion, text: "将死！你抓住了王。" }
  - { id: ch.pl.intro, role: companion, text: "来考考你，会的就跳过。" }
  - { id: ch.pl.known, role: companion, text: "这一章，你已经会了。" }
  - { id: ch.pl.learn, role: companion, text: "这一章，我们先学一学。" }
  - { id: ch.l.a1, role: narrator, text: "车走直线，横着竖着都行。" }
  - { id: ch.l.a2, role: narrator, text: "石头挡路，车不能跳过去。" }
  - { id: ch.l.a3, role: narrator, text: "走到黑子上，就是吃掉它。" }
  - { id: ch.l.a3.danger, role: narrator, text: "黑兵守着这里，走进去会被吃。" }
  - { id: ch.l.b1, role: narrator, text: "象只走斜线，走多远都行。" }
  - { id: ch.l.b2, role: narrator, text: "象永远走同一种颜色。" }
  - { id: ch.l.b3, role: narrator, text: "两个象，深浅格都管得到。" }
  - { id: ch.l.q1, role: narrator, text: "后，既走直线，又走斜线。" }
  - { id: ch.l.q2, role: narrator, text: "先想好路线，再走。" }
  - { id: ch.l.q3, role: narrator, text: "后很强，也会被小兵吃。" }
  - { id: ch.l.k1, role: narrator, text: "王八个方向，一次走一格。" }
  - { id: ch.l.k2, role: narrator, text: "王不能走到会被吃的格。" }
  - { id: ch.l.k2.kings, role: narrator, text: "两个王，不能挨着站。" }
  - { id: ch.l.k3, role: narrator, text: "王能吃子，但不吃有保护的。" }
  - { id: ch.l.n1, role: narrator, text: "马走日字：直两格，拐一格。" }
  - { id: ch.l.n2, role: narrator, text: "马能跳过去，找最短的路。" }
  - { id: ch.l.n3, role: narrator, text: "马吃子，也要看安不安全。" }
  - { id: ch.l.p1, role: narrator, text: "兵只往前，第一步可走两格。" }
  - { id: ch.l.p2, role: narrator, text: "兵斜着吃，不能直着吃。" }
  - { id: ch.l.p3, role: narrator, text: "兵走到底线，变成别的子。" }
  - { id: ch.l.p4, role: narrator, text: "只用兵，谁先冲到底线谁赢。" }
  - { id: ch.l.g1, role: narrator, text: "来学两个秘密招式。" }
  - { id: ch.l.g1.castle, role: narrator, text: "王和车一起走，叫易位。" }
  - { id: ch.l.g1.ep, role: narrator, text: "对方兵走两格，可以斜着吃它。" }
  - { id: ch.l.g2, role: narrator, text: "把棋子摆回它们的家。" }
  - { id: ch.l.c1, role: narrator, text: "攻击王是将军，逃不掉是将死。" }
  - { id: ch.l.c3, role: narrator, text: "被将军了：王可以走开。" }
  - { id: ch.l.c4, role: narrator, text: "也可以拿自己的子挡住。" }
  - { id: ch.l.c5, role: narrator, text: "还可以把将军的子吃掉。" }
  - { id: ch.l.m1, role: narrator, text: "能逃是将军，逃不掉是将死。" }
  - { id: ch.l.m1.double, role: narrator, text: "两个子一起将军，只有王能走。" }
  - { id: ch.l.m7, role: narrator, text: "没被将军，却无路可走：和棋。" }
  - { id: ch.l.v1, role: narrator, text: "兵一分，马象三分。" }
  - { id: ch.l.v1.b, role: narrator, text: "车五分，后九分。" }
  - { id: ch.l.v3, role: narrator, text: "没人保护的子，放心吃。" }
  - { id: ch.l.v4, role: narrator, text: "有人保护，吃了会被吃回来。" }
  - { id: ch.l.v5, role: narrator, text: "吃过去，被吃回来，算一算。" }
  - { id: ch.l.v6, role: narrator, text: "有保护的子，别用大子吃。" }
  - { id: ch.l.v7, role: narrator, text: "子被攻击：躲开，或找人护。" }
  - { id: ch.l.m2, role: narrator, text: "王被自己的兵挡住，车冲到底线。" }
  - { id: ch.l.c2, role: narrator, text: "能将军的走法，不止一种。" }
  - { id: ch.l.m3, role: narrator, text: "后贴着王，后面有人保护。" }
  - { id: ch.l.m4, role: narrator, text: "两个车像梯子，往上爬。" }
  - { id: ch.l.m5, role: narrator, text: "马的将军，没法挡住。" }
  - { id: ch.l.m6, role: narrator, text: "象和后，在斜线上配合。" }
  - { id: ch.l.m8, role: narrator, text: "快赢了，先看对方有没有路。" }
  - { id: ch.l.c6, role: narrator, text: "三种办法，选最好的那种。" }
  - { id: ch.l.boss, role: narrator, text: "来一次大考验，用上学过的。" }
  - { id: ch.l.e1, role: narrator, text: "两个车轮流将军，把王赶到边。" }
  - { id: ch.l.e2, role: narrator, text: "后和车，也能爬梯子。" }
  - { id: ch.l.e3, role: narrator, text: "用后画个盒子，慢慢变小。" }
  - { id: ch.l.e4, role: narrator, text: "王走过来帮忙，小心逼和。" }
  - { id: ch.l.e5, role: narrator, text: "兵冲到底线变后，再将死。" }
  - { id: ch.l.e6, role: narrator, text: "一个车加王，也能将死。" }
  - { id: ch.l.f1, role: narrator, text: "马和后能同时攻击两个子。" }
  - { id: ch.l.t1, role: narrator, text: "先将军，再将死：两步杀。" }
  - { id: ch.p.stars, role: companion, text: "把棋子走到星星上。" }
  - { id: ch.p.capture, role: companion, text: "把黑棋全部吃掉。" }
  - { id: ch.p.go, role: companion, text: "走到我说的格子。" }
  - { id: ch.p.tap, role: companion, text: "点出它能走的所有格。" }
  - { id: ch.p.tapcap, role: companion, text: "点出它能吃的子。" }
  - { id: ch.p.choose, role: companion, text: "选一个。" }
  - { id: ch.p.castle, role: companion, text: "现在能易位吗？" }
  - { id: ch.p.mate1, role: companion, text: "白先走，一步将死黑王。" }
  - { id: ch.p.mate2, role: companion, text: "两步将死黑王。" }
  - { id: ch.p.free, role: companion, text: "吃哪个子，最划算？" }
  - { id: ch.p.checks1, role: companion, text: "哪一步能将军？" }
  - { id: ch.p.checksN, role: companion, text: "找出所有将军。" }
  - { id: ch.p.escape, role: companion, text: "白王被将军了，想办法。" }
  - { id: ch.p.guard, role: companion, text: "它有人保护吗？" }
  - { id: ch.p.trade, role: companion, text: "这样换，赚还是亏？" }
  - { id: ch.p.mos, role: companion, text: "是将死，还是逼和？" }
  - { id: ch.p.save, role: companion, text: "救一救被攻击的子。" }
  - { id: ch.p.setup, role: companion, text: "把棋子摆回家。" }
  - { id: ch.p.battle, role: companion, text: "把兵都吃光！" }
  - { id: ch.p.pawnwar, role: companion, text: "先冲到底线的赢。" }
  - { id: ch.p.endgame, role: companion, text: "用学过的招，将死他。" }
  - { id: ch.q.bishop-never, role: companion, text: "白象走不到哪一格？" }
  - { id: ch.q.queen-steps, role: companion, text: "后走到这格，最少几步？" }
  - { id: ch.q.who-one-move, role: companion, text: "谁一步就能走到这格？" }
  - { id: ch.q.knight-steps, role: companion, text: "马走到这格，最少几步？" }
  - { id: ch.q.pawn-blocked, role: companion, text: "这个兵能往前走吗？" }
  - { id: ch.q.promote-best, role: companion, text: "变成哪个最厉害？" }
  - { id: ch.q.queen-square, role: companion, text: "后站在哪一格？" }
  - { id: ch.q.who-ahead, role: companion, text: "白方多几分？" }
  - { id: ch.q.mate-or-check, role: companion, text: "这是将军，还是将死？" }
  - { id: ch.w.turn, role: companion, text: "现在不能动这个子。" }
  - { id: ch.w.own, role: companion, text: "那里是你自己的子。" }
  - { id: ch.w.block, role: companion, text: "路被挡住了。" }
  - { id: ch.w.shapeR, role: companion, text: "车只走直线。" }
  - { id: ch.w.shapeB, role: companion, text: "象只走斜线。" }
  - { id: ch.w.shapeN, role: companion, text: "马走日字。" }
  - { id: ch.w.shapeQ, role: companion, text: "后走直线或斜线。" }
  - { id: ch.w.shapeK, role: companion, text: "王一次只走一格。" }
  - { id: ch.w.bishopColor, role: companion, text: "象只走一种颜色。" }
  - { id: ch.w.pawnFwd, role: companion, text: "兵只往前走。" }
  - { id: ch.w.pawnStraight, role: companion, text: "兵不能直着吃。" }
  - { id: ch.w.pawnDouble, role: companion, text: "兵只有第一步能走两格。" }
  - { id: ch.w.pawnDiag, role: companion, text: "兵斜着走，只能去吃子。" }
  - { id: ch.w.kingDanger, role: companion, text: "王不能走进危险的格。" }
  - { id: ch.w.kingsTouch, role: companion, text: "两个王不能挨着。" }
  - { id: ch.w.pinned, role: companion, text: "它一走，王就被吃了。" }
  - { id: ch.w.stillCheck, role: companion, text: "王还在被将军。" }
  - { id: ch.w.castleMoved, role: companion, text: "王或车动过了，不能易位。" }
  - { id: ch.w.castleBetween, role: companion, text: "中间还有子。" }
  - { id: ch.w.castleCheck, role: companion, text: "被将军时，不能易位。" }
  - { id: ch.w.castleThrough, role: companion, text: "王不能路过危险的格。" }
  - { id: ch.x.escape, role: companion, text: "王还能走开。" }
  - { id: ch.x.block, role: companion, text: "还能挡住。" }
  - { id: ch.x.capture, role: companion, text: "还能吃掉它。" }
  - { id: ch.x.none, role: companion, text: "三种办法都不行。" }
  - { id: ch.x.refute, role: companion, text: "对方会这样走。" }
  - { id: ch.f.ok1, role: companion, text: "对，就是这里。" }
  - { id: ch.f.ok2, role: companion, text: "你看得很仔细。" }
  - { id: ch.f.again, role: companion, text: "再看一眼，再做一道很像的。" }
  - { id: ch.f.done, role: companion, text: "这一课学完了。" }
  - { id: ch.f.rest, role: companion, text: "休息一下，也很好。" }
  - { id: ch.g.white, role: companion, text: "你执白，先走。" }
  - { id: ch.g.black, role: companion, text: "你执黑，对方先走。" }
  - { id: ch.g.check, role: companion, text: "将军！" }
  - { id: ch.g.checked, role: companion, text: "你被将军了。" }
  - { id: ch.g.check3, role: companion, text: "应将：走开、挡住、吃掉。" }
  - { id: ch.g.mate.win, role: companion, text: "将死了，你赢了！" }
  - { id: ch.g.mate.lose, role: companion, text: "你被将死了，一起复盘。" }
  - { id: ch.g.stale, role: companion, text: "逼和了，算和棋。" }
  - { id: ch.g.insuff, role: companion, text: "子不够了，算和棋。" }
  - { id: ch.g.rep, role: companion, text: "同样的局面三次，和棋。" }
  - { id: ch.g.fifty, role: companion, text: "五十回合没吃子，和棋。" }
  - { id: ch.g.resign, role: companion, text: "想认输吗？也可以悔棋。" }
  - { id: ch.g.takeback, role: companion, text: "这盘，可以退回去再想想。" }
  - { id: ch.g.promo, role: companion, text: "兵到底线了，选一个子。" }
  - { id: ch.g.finish, role: companion, text: "对方只剩王了，用学过的招。" }
  - { id: ch.g.ep, role: companion, text: "吃过路兵！" }
  - { id: ch.g.castle, role: companion, text: "王和车，一起走。" }
  - { id: ch.g.help1, role: companion, text: "要不要，教练回来帮你？" }
  - { id: ch.g.help2, role: companion, text: "要不要，让一个子试试？" }
  - { id: ch.g.easy, role: companion, text: "要不要先开轻松档？" }
  - { id: ch.g.resign.win, role: companion, text: "它认输了，这盘算你赢。" }
  - { id: ch.g.tired, role: companion, text: "它累了，这盘算你赢。" }
  - { id: ch.g.draw.ok, role: companion, text: "和棋，没输，再来一盘。" }
  - { id: ch.xj.intro, role: companion, text: "来个小局：从残局开始。" }
  - { id: ch.xj.pick, role: companion, text: "选一个小局。" }
  - { id: ch.xj.win, role: companion, text: "小局完成！" }
  - { id: ch.xj.cap, role: companion, text: "这个小局走了很久。" }
  - { id: ch.xj.again, role: companion, text: "再试一次，或者换一个。" }
  - { id: ch.c.hang, role: companion, text: "等一下，这个子会被吃掉。" }
  - { id: ch.c.hang2, role: companion, text: "那个子，还在被攻击。" }
  - { id: ch.c.who, role: companion, text: "看看，哪个黑子会吃它？" }
  - { id: ch.c.mate, role: companion, text: "小心，对方有一步杀。" }
  - { id: ch.c.stale, role: companion, text: "这步会让他没路可走，变和棋。" }
  - { id: ch.c.go, role: companion, text: "好，你自己决定。" }
  - { id: ch.h.2, role: companion, text: "看，这个子是关键。" }
  - { id: ch.h.3, role: companion, text: "看我走一遍。" }
  - { id: ch.h.1.mate, role: companion, text: "这里有一步杀。" }
  - { id: ch.h.1.check, role: companion, text: "有一步能将军。" }
  - { id: ch.h.1.free, role: companion, text: "有个子可以白吃。" }
  - { id: ch.h.1.save, role: companion, text: "有个子正被攻击。" }
  - { id: ch.h.1.esc, role: companion, text: "先想怎么应将。" }
  - { id: ch.h.1.stale, role: companion, text: "小心，别把他逼和。" }
  - { id: ch.h.1.stars, role: companion, text: "先去最近的星星。" }
  - { id: ch.h.1.move, role: companion, text: "看，先动这个子。" }
  - { id: ch.h.1.trade, role: companion, text: "先数数，吃得值不值。" }
  - { id: ch.rb.1.intro, role: companion, text: "小螺丝：随便走，从不吃子。" }
  - { id: ch.rb.2.intro, role: companion, text: "吊车：看见子就想抓。" }
  - { id: ch.rb.3.intro, role: companion, text: "探照灯：会看自己的子安不安全。" }
  - { id: ch.rb.4.intro, role: companion, text: "机械臂：一步杀从不放过。" }
  - { id: ch.rb.5.intro, role: companion, text: "鹊桥：会想两步。" }
  - { id: ch.rb.6.intro, role: companion, text: "悟空：棋艺舱里最强的。" }
  - { id: ch.rb.win, role: companion, text: "你赢了，它加入了你的乘组。" }
  - { id: ch.rb.lose, role: companion, text: "这盘它赢了，我们看看哪里能改。" }
  - { id: ch.bt.intro, role: companion, text: "小螺丝的兵要冲到你的底线。" }
  - { id: ch.bt.rule, role: companion, text: "把它们全部吃掉。" }
  - { id: ch.bt.win, role: companion, text: "城守住了！" }
  - { id: ch.pz.dec, role: companion, text: "有几步只是将军，不是杀。" }
  - { id: ch.d.intro, role: companion, text: "把平板放平，面对面下棋。" }
  - { id: ch.d.who, role: companion, text: "谁让谁，选一选。" }
  - { id: ch.d.seat, role: companion, text: "黑棋朝向爸爸，各看各的。" }
  - { id: ch.d.ask, role: companion, text: "悔棋，请双方同意。" }
  - { id: ch.d.ok, role: companion, text: "两边都同意，退回一步。" }
  - { id: ch.d.drawq, role: companion, text: "提议和棋，对方同意吗？" }
  - { id: ch.d.end, role: companion, text: "下完了，要复盘吗？" }
  - { id: ch.d.coach, role: companion, text: "领航员只看小步步这一边。" }
  - { id: ch.d.card, role: companion, text: "这盘，和家里的棋盘一样。" }
  - { id: ch.d.house, role: companion, text: "家规可以改，棋盘上看得到。" }
  - { id: ch.d.cancel, role: companion, text: "请求撤回了，棋盘可以走。" }
  - { id: ch.r.intro, role: companion, text: "我们来看看精彩时刻。" }
  - { id: ch.r.mate, role: companion, text: "这一步将死，抓住了机会。" }
  - { id: ch.r.win, role: companion, text: "这个子吃得很划算。" }
  - { id: ch.r.miss, role: companion, text: "这里本来有一步杀。" }
  - { id: ch.r.hang, role: companion, text: "这个子被吃了，先看一眼。" }
  - { id: ch.r.none, role: companion, text: "这盘没有特别的时刻。" }
  - { id: ch.r.tip, role: companion, text: "下一盘，走前先看一眼。" }
  - { id: ch.t.1, role: companion, text: "车走直线，不能跳过别的子。" }
  - { id: ch.t.2, role: companion, text: "象只走斜线，一直在同色格。" }
  - { id: ch.t.3, role: companion, text: "后等于车加象，威力最大。" }
  - { id: ch.t.4, role: companion, text: "王一次一格，不能走进攻击。" }
  - { id: ch.t.5, role: companion, text: "马走日字，能跳过去。" }
  - { id: ch.t.6, role: companion, text: "兵斜吃，到底线能变身。" }
  - { id: ch.t.8, role: companion, text: "被将军：走开、挡住、吃掉。" }
  - { id: ch.t.9, role: companion, text: "吃子前，先数分，看保护。" }
  - { id: ch.t.10, role: companion, text: "一步杀要找：将军里的那一步。" }
  - { id: ch.t.11, role: companion, text: "后王杀：先画盒子，再叫王来。" }
  - { id: ch.cd.R, role: narrator, text: "车", norm: "车是最早的棋子之一。古时候的棋里，它是一辆战车。" }
  - { id: ch.cd.B, role: narrator, text: "象", norm: "国际象棋的象，在英语里叫\"主教\"。" }
  - { id: ch.cd.Q, role: narrator, text: "后", norm: "很久以前，后一次只能走一格。五百多年前，人们让它变成了最厉害的棋子。" }
  - { id: ch.cd.K, role: narrator, text: "王", norm: "王不能被吃掉。所有的棋子都在保护它。" }
  - { id: ch.cd.N, role: narrator, text: "马", norm: "马是唯一能跳过别的棋子的棋子。" }
  - { id: ch.cd.P, role: narrator, text: "兵", norm: "兵走到最后一行可以变身。这叫\"升变\"。" }
  - { id: ch.cd.castle, role: narrator, text: "王车易位", norm: "王车易位是唯一一步能同时走两个棋子的棋。" }
  - { id: ch.cd.ep, role: narrator, text: "吃过路兵", norm: "吃过路兵只能在对方的兵刚走完两格的下一步吃。" }
  - { id: ch.cd.values, role: narrator, text: "棋子的分数", norm: "分数帮你算账：吃掉的分数比丢掉的多，就是赚。" }
  - { id: ch.cd.check, role: narrator, text: "应将三招", norm: "被将军时：走开、挡住、吃掉。" }
  - { id: ch.cd.backrank, role: narrator, text: "底线杀", norm: "王的前面被自己的兵堵住，是最常见的被将死的样子。" }
  - { id: ch.cd.stalemate, role: narrator, text: "逼和", norm: "逼和是和棋，不算谁赢。赢面大的时候要小心。" }
