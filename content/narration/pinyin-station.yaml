    {
      "id": "py.tip.d-p",
      "role": "companion",
      "text": "左边这个，小肚子在左下；右边这个，小肚子在右上。"
    },
    {
      "id": "py.tip.f-t",
      "role": "companion",
      "text": "左边这个像一根弯弯的小拐杖；右边这个像一把直直的小伞把。"
    },
    {
      "id": "py.tip.m-n",
      "role": "companion",
      "text": "左边这个有两个门洞；右边这个只有一个门洞。"
    },
    {
      "id": "py.tip.ai-ei",
      "role": "companion",
      "text": "左边这个，嘴巴先张大，再把嘴角扁开；右边这个，嘴巴扁扁的，像要笑。"
    },
    {
      "id": "py.tip.ao-ou",
      "role": "companion",
      "text": "左边这个，嘴巴从大大的慢慢变圆；右边这个，嘴巴从圆圆的慢慢变小。"
    },
    {
      "id": "py.tip.ui-iu",
      "role": "companion",
      "text": "左边这个，嘴巴先圆后扁；右边这个，嘴巴先扁后圆。"
    },
    {
      "id": "py.tip.ie-ve",
      "role": "companion",
      "text": "左边这个，嘴巴一直扁扁地笑着；右边这个，嘴巴先圆圆的再笑。",
      "norm": "左边这个，嘴巴一直扁扁的笑着；右边这个，嘴巴先圆圆的再笑。"
    },
    {
      "id": "py.tip.an-en",
      "role": "companion",
      "text": "左边这个，嘴巴张得大一些；右边这个，嘴巴小一些。"
    },
    {
      "id": "py.tip.in-un",
      "role": "companion",
      "text": "左边这个，嘴巴扁扁地笑着；右边这个，嘴巴圆圆地噘着。",
      "norm": "左边这个，嘴巴扁扁的笑着；右边这个，嘴巴圆圆的撅着。"
    },
    {
      "id": "py.I",
      "role": "companion",
      "text": "找一找，哪一个和上面的一模一样？"
