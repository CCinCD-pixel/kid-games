# Netlify (free plan): main = production. Every push to main costs a production deploy,
# so batch changes and use Deploy Previews / ./play.sh for review.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Browsers are only needed for local tests, never on Netlify.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Cache headers live in public/_headers (copied to dist/_headers).
# Redirects are generated into dist/_redirects from site/redirects.json and game.json "redirectFrom".
