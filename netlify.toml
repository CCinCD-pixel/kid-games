# Netlify (free plan): main = production. Every push to main costs a production deploy (15 credits),
# so batch changes, run every check locally first (.githooks/pre-push) and review with ./play.sh.
# A commit message containing [skip netlify] also skips the build.
[build]
  command = "npm ci && npm run build"
  publish = "dist"
  # Credits: every production build costs 15 of the free plan's monthly credits. Skip the build when nothing that
  # feeds dist/ changed (docs, tests, hooks, README). Exit 0 = skip, non-zero = build. If CACHED_COMMIT_REF is
  # missing/unknown, git diff fails (non-zero) and the build runs — the safe default.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)tests' ':(exclude).githooks' ':(exclude).context' ':(exclude)README.md' ':(exclude,glob)**/*.spec.ts' ':(exclude,glob)**/*.test.ts'"

[build.environment]
  NODE_VERSION = "20"
  # Browsers are only needed for local tests, never on Netlify.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Cache headers live in public/_headers (copied to dist/_headers).
# Redirects are generated into dist/_redirects from site/redirects.json and game.json "redirectFrom".
